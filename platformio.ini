; Evil Twin & Deauth Detector  --  Waveshare ESP32-S3-Touch-LCD-3.49
; DEFENSIVE / PASSIVE: sniffs 802.11 management frames, never transmits.
; Alerts on deauth/disassoc floods and Evil Twin access points, with a
; bold LVGL UI on the 640x172 AXS15231B QSPI panel.
;
; Uses the pioarduino platform (Arduino-ESP32 core 3.x / IDF 5.x) because
; the Waveshare display driver relies on IDF5 esp_lcd / i2c_master APIs.

[env:esp32-s3-waveshare-349]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.psram_type = opi
; S3 N16R8 module: QIO flash + OPI (octal) PSRAM. Without this the Arduino
; core builds quad-PSRAM support and PSRAM init fails at boot (LVGL buffers
; live in SPIRAM, so that assert-loops the detector).
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: find our lv_conf.h in src/
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -O2

; LVGL software rendering is CPU-bound; the Arduino default is -Os (size).
build_unflags = -Os

lib_deps =
    lvgl/lvgl@~8.4.0
